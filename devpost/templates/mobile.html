<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solari Screener on mobile</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      main {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
      }
      .phones {
        display: flex;
        gap: 64px;
        align-items: flex-start;
      }
      figure {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .phone {
        width: 356px;
        height: 770px;
        border-radius: 44px;
        border: 1px solid var(--border-strong);
        background: #000;
        padding: 10px;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.55);
      }
      .phone img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        border-radius: 34px;
      }
      figcaption {
        font-family: var(--font-mono);
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <main>
      <div class="phones">
        <figure>
          <div class="phone"><img src="../screenshots/_phone-home.png" alt="" /></div>
          <figcaption>Submissions</figcaption>
        </figure>
        <figure>
          <div class="phone"><img src="../screenshots/_phone-detail.png" alt="" /></div>
          <figcaption>One submission</figcaption>
        </figure>
        <figure>
          <div class="phone"><img src="../screenshots/_phone-review.png" alt="" /></div>
          <figcaption>Review</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
